[project]
name = "india-knowledge-graph-backend"
version = "0.1.0"
description = "AI-powered Event Intelligence & Verification Platform for Indian Affairs"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "redis>=5.0.8",
    "arq>=0.26.1",
    "structlog>=24.4.0",
    "httpx>=0.27.2",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

