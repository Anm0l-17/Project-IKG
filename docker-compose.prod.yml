version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ikg-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ikg-network

networks:
  ikg-network:
    driver: bridge
