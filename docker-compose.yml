version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ikg-postgres
    restart: always
    environment:
      POSTGRES_USER: ikg_user
      POSTGRES_PASSWORD: ikg_password
      POSTGRES_DB: ikg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ikg_user -d ikg_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikg-network

  redis:
    image: redis:7-alpine
    container_name: ikg-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikg-network

  # --- Future / Optional Roadmap Services (Not active in v0.1 runtime) ---
  # Release 1.0: Neo4j graph projections
  neo4j:
    image: neo4j:5-community
    container_name: ikg-neo4j
    restart: always
    profiles:
      - future-infra
    environment:
      NEO4J_AUTH: neo4j/ikg_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikg-network

  # Optional vector database (Beta 0.5 uses PostgreSQL pgvector)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ikg-qdrant
    restart: always
    profiles:
      - future-infra
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "echo '{\"healthcheck\": true}' | nc localhost 6333 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikg-network

  minio:
    image: minio/minio:latest
    container_name: ikg-minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/ikg-evidence && /usr/bin/minio server /data --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ikg-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikg-backend
    restart: always
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ikg_user:ikg_password@postgres:5432/ikg_db
      ALEMBIC_DATABASE_URL: postgresql+psycopg://ikg_user:ikg_password@postgres:5432/ikg_db
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ikg_password
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - ikg-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ikg-worker
    restart: always
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://ikg_user:ikg_password@postgres:5432/ikg_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ikg-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ikg-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ikg-network

volumes:
  postgres_data:
  neo4j_data:
  qdrant_storage:
  redis_data:
  minio_data:

networks:
  ikg-network:
    driver: bridge
